[package]
name = "unsniped-hook"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "unsniped_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Localnet tests only: a signable stand-in for FOMO's relayer key. Never in a deployed build.
test-relayer = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
spl-tlv-account-resolution = "0.9.0"
spl-transfer-hook-interface = "0.9.0"
spl-discriminator = "0.4.1"
solana-security-txt = "1.1.1"
